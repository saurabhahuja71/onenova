<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title3 desc3">
  <title id="title3">Provision flow for Oracle Restart on Kubernetes</title>
  <desc id="desc3">Left-to-right flow from pre-check and image build through apply, reconcile, ready, and SQL connect.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="16" fill="url(#bg3)"/>
  <text x="32" y="40" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Provision flow (what you do vs what the cluster does)</text>

  <!-- Steps -->
  <rect x="28" y="80" width="140" height="100" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="98" y="115" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">1. Pre-flight</text>
  <text x="98" y="138" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">kubectl get CRD</text>
  <text x="98" y="156" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">secrets · nodes</text>

  <line x1="168" y1="130" x2="188" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="190" y="80" width="140" height="100" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="260" y="115" text-anchor="middle" fill="#fda4af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">2. Slim image</text>
  <text x="260" y="138" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">build GitHub slim</text>
  <text x="260" y="156" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">no OCR slim · no zip</text>

  <line x1="330" y1="130" x2="350" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="352" y="80" width="140" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="422" y="115" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">3. Apply CR</text>
  <text x="422" y="138" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">OracleRestart YAML</text>
  <text x="422" y="156" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">namespace orestart</text>

  <line x1="492" y1="130" x2="512" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="514" y="80" width="150" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="589" y="115" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">4. Operator</text>
  <text x="589" y="138" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">pod · svc · mounts</text>
  <text x="589" y="156" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">ASM from CR disks</text>

  <line x1="664" y1="130" x2="684" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="686" y="80" width="120" height="100" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="746" y="115" text-anchor="middle" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">5. Ready</text>
  <text x="746" y="138" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">setup log OK</text>
  <text x="746" y="156" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">CR status</text>

  <line x1="806" y1="130" x2="826" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="828" y="80" width="108" height="100" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="882" y="115" text-anchor="middle" fill="#67e8f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">6. Connect</text>
  <text x="882" y="138" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">NP / LB /</text>
  <text x="882" y="156" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">ClusterIP</text>

  <text x="32" y="230" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Purple / pink = you prepare · green = operator reconciles · cyan = traffic path after Ready</text>
  <text x="32" y="252" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Works the same conceptual model on OKE, bare-metal K8s, or other managed clusters — swap LB integration for your cloud.</text>
</svg>
