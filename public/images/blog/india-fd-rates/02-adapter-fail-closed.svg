<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Fail-closed bank adapter behavior</title>
  <desc id="desc">Successful adapters promote LIVE verified rates into the ranking; failed adapters are recorded and excluded instead of inventing a number.</desc>
  <rect width="1440" height="640" rx="22" fill="#e2e8f0"/>
  <text x="720" y="54" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="#0f172a">Fail closed: never invent an FD rate</text>

  <!-- Success path -->
  <rect x="48" y="100" width="640" height="460" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="368" y="150" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700" fill="#14532d">Success path</text>

  <rect x="100" y="180" width="520" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="360" y="224" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" fill="#166534">Official HTML / PDF source returns 200</text>

  <text x="360" y="290" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#16a34a">↓</text>

  <rect x="100" y="310" width="520" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="360" y="354" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" fill="#166534">Adapter finds tenure-linked retail rows</text>

  <text x="360" y="420" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#16a34a">↓</text>

  <rect x="100" y="440" width="520" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="478" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#14532d">LIVE_VERIFIED → ranked</text>
  <text x="360" y="506" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#166534">Written to fd-rates.json and README tables</text>

  <!-- Failure path -->
  <rect x="752" y="100" width="640" height="460" rx="16" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
  <text x="1072" y="150" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700" fill="#7f1d1d">Failure path</text>

  <rect x="804" y="180" width="520" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="1064" y="224" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" fill="#991b1b">403 / 404 / headline-only page</text>

  <text x="1064" y="290" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#b91c1c">↓</text>

  <rect x="804" y="310" width="520" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="1064" y="354" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" fill="#991b1b">No silent fallback or guessed % </text>

  <text x="1064" y="420" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#b91c1c">↓</text>

  <rect x="804" y="440" width="520" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="1064" y="478" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#7f1d1d">FAILED → not ranked</text>
  <text x="1064" y="506" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#991b1b">Logged in fetch_failures.json for repair</text>
</svg>
