<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">India FD Rates daily pipeline</title>
  <desc id="desc">Flow from GitHub Actions schedule through bank adapters, validation, README regeneration, and GitHub Pages publish.</desc>
  <rect width="1440" height="720" rx="22" fill="#e2e8f0"/>
  <text x="720" y="58" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#0f172a">India FD Rates — daily collection pipeline</text>
  <text x="720" y="96" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#475569">Official bank sources → fail-closed adapters → ranked tables → GitHub Pages</text>

  <!-- Step boxes -->
  <rect x="48" y="160" width="200" height="120" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="148" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#0f172a">Actions</text>
  <text x="148" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#475569">cron 02:30 UTC</text>
  <text x="148" y="264" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#475569">+ fixture tests</text>

  <path d="M258 220 H300" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="310" y="160" width="220" height="120" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="420" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#0f172a">update_rates.py</text>
  <text x="420" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#475569">banks.yaml registry</text>
  <text x="420" y="264" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#0f766e">per-bank adapters</text>

  <path d="M540 220 H582" stroke="#64748b" stroke-width="3" fill="none"/>

  <rect x="590" y="140" width="240" height="160" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="710" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#0f172a">data artifacts</text>
  <text x="710" y="220" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#2563eb">fd-rates.json</text>
  <text x="710" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#b45309">fetch_failures.json</text>
  <text x="710" y="276" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#475569">ranking_audit.json</text>

  <path d="M840 220 H882" stroke="#64748b" stroke-width="3" fill="none"/>

  <rect x="890" y="160" width="220" height="120" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1000" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#0f172a">validate + reports</text>
  <text x="1000" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#475569">README tables</text>
  <text x="1000" y="264" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#475569">verification_report</text>

  <path d="M1120 220 H1162" stroke="#64748b" stroke-width="3" fill="none"/>

  <rect x="1170" y="160" width="220" height="120" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1280" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#14532d">GitHub Pages</text>
  <text x="1280" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#166534">commit if changed</text>
  <text x="1280" y="264" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#166534">publish site</text>

  <!-- Bottom policy strip -->
  <rect x="48" y="360" width="1344" height="280" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="410" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Ranking policy (published Top-N)</text>
  <text x="80" y="455" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#166534">✓ Callable resident domestic retail · tenure-linked regular/senior rates</text>
  <text x="80" y="500" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#b91c1c">✗ Non-callable · bulk · NRI-only · institutional · guessed parses</text>
  <text x="80" y="555" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#334155">Categories: Private sector · Public sector · Small finance</text>
  <text x="80" y="600" font-family="ui-monospace,monospace" font-size="16" fill="#64748b">config/banks.yaml  →  scripts/banks/*.py  →  data/*.json</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
