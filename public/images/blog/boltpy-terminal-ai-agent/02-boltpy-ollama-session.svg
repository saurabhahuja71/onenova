<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Using Boltpy with local Ollama</title>
  <desc id="desc">Terminal screenshot-style illustration showing a Bolt command using Ollama and a coding prompt response.</desc>
  <rect width="1440" height="820" rx="22" fill="#0f172a"/>
  <rect x="42" y="34" width="1356" height="752" rx="15" fill="#111827" stroke="#475569" stroke-width="3"/>
  <rect x="42" y="34" width="1356" height="52" rx="15" fill="#1e293b"/>
  <circle cx="75" cy="60" r="8" fill="#ef4444"/><circle cx="103" cy="60" r="8" fill="#f59e0b"/><circle cx="131" cy="60" r="8" fill="#22c55e"/>
  <text x="720" y="67" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#cbd5e1">Local Ollama · Bolt</text>
  <text x="70" y="140" font-family="ui-monospace,monospace" font-size="21" fill="#86efac">$ ollama pull qwen3-coder</text>
  <text x="70" y="178" font-family="ui-monospace,monospace" font-size="19" fill="#94a3b8">pulling manifest … success</text>
  <text x="70" y="224" font-family="ui-monospace,monospace" font-size="21" fill="#86efac">$ bolt --provider ollama --endpoint http://localhost:11434 --model qwen3-coder</text>
  <line x1="70" y1="250" x2="1370" y2="250" stroke="#334155" stroke-width="2"/>
  <text x="70" y="292" font-family="ui-monospace,monospace" font-size="20" fill="#f8fafc">› Explain the slowest part of this Python function and write a test.</text>
  <text x="70" y="340" font-family="ui-monospace,monospace" font-size="20" fill="#67e8f9">● Reading src/app.py</text>
  <text x="70" y="376" font-family="ui-monospace,monospace" font-size="20" fill="#4ade80">✓ Finished</text>
  <text x="70" y="426" font-family="ui-monospace,monospace" font-size="19" fill="#e2e8f0">The nested scan is O(n²). Build a lookup set first,</text>
  <text x="70" y="460" font-family="ui-monospace,monospace" font-size="19" fill="#e2e8f0">then add a regression test for duplicates and empty input.</text>
  <rect x="70" y="520" width="1300" height="82" rx="10" fill="#0b1220" stroke="#22c55e" stroke-width="3"/>
  <text x="92" y="558" font-family="ui-monospace,monospace" font-size="19" fill="#94a3b8">Type another prompt…</text>
  <text x="70" y="656" font-family="ui-monospace,monospace" font-size="17" fill="#94a3b8">Bolt | Mode: ASK | Model: ollama/qwen3-coder | Workspace: /home/sauahuja/boltpy</text>
  <text x="70" y="710" font-family="ui-monospace,monospace" font-size="17" fill="#64748b">Private by default: prompts and code stay on your Ollama host.</text>
</svg>
