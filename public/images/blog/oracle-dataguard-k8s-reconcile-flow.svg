<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Data Guard provision flow on Kubernetes</title>
  <desc id="desc">Steps from secrets through primary, standby, Broker Healthy, DGMGRL verify, and day-2 operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1040" height="420" rx="16" fill="url(#bg)"/>
  <text x="32" y="40" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Provision flow: primary → standby → Broker</text>
  <text x="32" y="62" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Same-cluster TCP Quick Start · never apply Broker before both SIDBs are Healthy</text>

  <g filter="url(#soft)">
    <rect x="28" y="100" width="150" height="140" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="103" y="128" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">1 · PREP</text>
  <text x="103" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Operator ≥ 2.2</text>
  <text x="103" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">admin + OCR</text>
  <text x="103" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">StorageClass</text>
  <text x="103" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">same image tag</text>
  <text x="103" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">you do this</text>

  <line x1="178" y1="170" x2="208" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="210" y="100" width="150" height="140" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="285" y="128" text-anchor="middle" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">2 · PRIMARY</text>
  <text x="285" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">apply primary</text>
  <text x="285" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">ARCHIVELOG</text>
  <text x="285" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">DG prereqs</text>
  <text x="285" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Healthy PRIMARY</text>
  <text x="285" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">wait gate</text>

  <line x1="360" y1="170" x2="390" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="392" y="100" width="160" height="140" rx="12" fill="url(#card)" stroke="#fb7185" stroke-width="1.5"/>
  </g>
  <text x="472" y="128" text-anchor="middle" fill="#fda4af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">3 · STANDBY</text>
  <text x="472" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">databaseRef</text>
  <text x="472" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Duplicate / FAL</text>
  <text x="472" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">PHYSICAL_</text>
  <text x="472" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">STANDBY</text>
  <text x="472" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">wait gate</text>

  <line x1="552" y1="170" x2="582" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="584" y="100" width="160" height="140" rx="12" fill="url(#card)" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="664" y="128" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">4 · BROKER</text>
  <text x="664" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">apply one DGB</text>
  <text x="664" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">runner Pod</text>
  <text x="664" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">config create</text>
  <text x="664" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Healthy</text>
  <text x="664" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">operator</text>

  <line x1="744" y1="170" x2="774" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="776" y="100" width="150" height="140" rx="12" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="851" y="128" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">5 · VERIFY</text>
  <text x="851" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">SHOW CONFIG</text>
  <text x="851" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">VALIDATE DB</text>
  <text x="851" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">transport /</text>
  <text x="851" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">apply lag</text>
  <text x="851" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">you verify</text>

  <line x1="926" y1="170" x2="956" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="958" y="100" width="58" height="140" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="987" y="165" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" transform="rotate(-90 987 175)">DAY-2</text>

  <rect x="28" y="270" width="984" height="120" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="48" y="302" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Gates that block progress</text>
  <text x="48" y="326" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Primary must be Healthy PRIMARY before standby apply · Standby must be Healthy PHYSICAL_STANDBY before Broker · One Broker per pair</text>
  <text x="48" y="350" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Same admin password on both SIDBs · Same Enterprise image line · Cross-cluster needs NLB reachability + TDE wallet copy before standby</text>
  <text x="48" y="374" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">If you rename samples, generate Broker YAML from status (render-dg-broker-from-status.sh) instead of applying the stock Broker sample.</text>
</svg>
