<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Client connectivity to Oracle RAC on Kubernetes</title>
  <desc id="desc2">Shows SQL clients connecting via SCAN NodePort or local instance listeners, and in-cluster apps via ClusterIP/DNS to RAC pods.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <filter id="soft2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="460" rx="16" fill="url(#bg2)"/>
  <text x="32" y="40" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">How clients reach the RAC database</text>
  <text x="32" y="62" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">SCAN NodePort vs local instance listeners vs in-cluster DNS</text>

  <!-- Clients -->
  <g filter="url(#soft2)">
    <rect x="40" y="100" width="160" height="70" rx="10" fill="url(#card2)" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="120" y="130" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">SQL*Plus / app</text>
  <text x="120" y="150" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">outside cluster</text>

  <g filter="url(#soft2)">
    <rect x="40" y="220" width="160" height="70" rx="10" fill="url(#card2)" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="120" y="250" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">In-cluster app</text>
  <text x="120" y="270" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">same K8s / OCNE</text>

  <!-- SCAN path -->
  <g filter="url(#soft2)">
    <rect x="250" y="88" width="220" height="56" rx="10" fill="url(#card2)" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="360" y="112" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">SCAN NodePort</text>
  <text x="360" y="130" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">workerIP:31521 → 1521</text>

  <!-- Instance LSNR -->
  <g filter="url(#soft2)">
    <rect x="250" y="160" width="220" height="56" rx="10" fill="url(#card2)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="360" y="184" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Instance LSNR NodePort</text>
  <text x="360" y="202" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">:31522 / :31523 (sample)</text>

  <!-- ClusterIP -->
  <g filter="url(#soft2)">
    <rect x="250" y="232" width="220" height="56" rx="10" fill="url(#card2)" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="360" y="256" text-anchor="middle" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">ClusterIP / DNS only</text>
  <text x="360" y="274" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">in-cluster apps · port 1521</text>

  <line x1="200" y1="130" x2="248" y2="116" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="200" y1="145" x2="248" y2="188" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="200" y1="250" x2="248" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Services box -->
  <g filter="url(#soft2)">
    <rect x="520" y="100" width="200" height="180" rx="10" fill="url(#card2)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="620" y="130" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">svc / rac namespace</text>
  <text x="620" y="158" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">racnode-scan-lsnr</text>
  <text x="620" y="180" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">racnode1-0-lsnr</text>
  <text x="620" y="202" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">racnode2-0-lsnr</text>
  <text x="620" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">VIP · headless names</text>
  <text x="620" y="252" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">service: soepdb</text>

  <line x1="470" y1="116" x2="518" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="470" y1="188" x2="518" y2="180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="470" y1="260" x2="518" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Pods -->
  <g filter="url(#soft2)">
    <rect x="760" y="100" width="160" height="80" rx="10" fill="url(#card2)" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="840" y="132" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">pod/racnode1-0</text>
  <text x="840" y="154" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">:1521 · instance 1</text>

  <g filter="url(#soft2)">
    <rect x="760" y="200" width="160" height="80" rx="10" fill="url(#card2)" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="840" y="232" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">pod/racnode2-0</text>
  <text x="840" y="254" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">:1521 · instance 2</text>

  <line x1="720" y1="160" x2="758" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="720" y1="200" x2="758" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="40" y="340" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Example (SCAN):</text>
  <text x="40" y="364" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12">sqlplus system/&lt;pwd&gt;@//&lt;worker-public-ip&gt;:31521/soepdb</text>
  <text x="40" y="392" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Verify RAC:</text>
  <text x="40" y="416" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12">select INSTANCE_NAME, HOST_NAME, DATABASE_TYPE from gv$instance;</text>
  <text x="40" y="440" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Expect DATABASE_TYPE = RAC and two (or more) instances — not SINGLE.</text>
</svg>
