<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">True Cache provision flow on Kubernetes</title>
  <desc id="desc">Steps from primary prep and blob ConfigMap through apply SIDB, operator reconcile, NLB and DNS, DATABASE IS READY TO USE, and app connect.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1040" height="420" rx="16" fill="url(#bg)"/>
  <text x="32" y="40" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Provision flow: you vs the operator</text>
  <text x="32" y="62" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">External RAC primary path · SIDB createAs: truecache · verify before declaring success</text>

  <!-- Step 1 -->
  <g filter="url(#soft)">
    <rect x="28" y="100" width="150" height="140" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="103" y="128" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">1 · PREP</text>
  <text x="103" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Network rules</text>
  <text x="103" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Secrets + OCR</text>
  <text x="103" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">DBCA blob</text>
  <text x="103" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Private DNS</text>
  <text x="103" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">you do this</text>

  <line x1="178" y1="170" x2="208" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#soft)">
    <rect x="210" y="100" width="150" height="140" rx="12" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="285" y="128" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">2 · APPLY</text>
  <text x="285" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">kubectl apply</text>
  <text x="285" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">SIDB truecache</text>
  <text x="285" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">external_rac</text>
  <text x="285" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">sample YAML</text>
  <text x="285" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">you do this</text>

  <line x1="360" y1="170" x2="390" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#soft)">
    <rect x="392" y="100" width="160" height="140" rx="12" fill="url(#card)" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="472" y="128" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">3 · RECONCILE</text>
  <text x="472" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Pod + PVC</text>
  <text x="472" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">ClusterIP svc</text>
  <text x="472" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">NLB Service</text>
  <text x="472" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">ExternalDNS A</text>
  <text x="472" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">operator does this</text>

  <line x1="552" y1="170" x2="582" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#soft)">
    <rect x="584" y="100" width="160" height="140" rx="12" fill="url(#card)" stroke="#fb7185" stroke-width="1.5"/>
  </g>
  <text x="664" y="128" text-anchor="middle" fill="#fda4af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">4 · CREATE TC</text>
  <text x="664" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Mount blob</text>
  <text x="664" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Callback warm</text>
  <text x="664" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">DBCA truecache</text>
  <text x="664" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Service assoc</text>
  <text x="664" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">image scripts</text>

  <line x1="744" y1="170" x2="774" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g filter="url(#soft)">
    <rect x="776" y="100" width="150" height="140" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="851" y="128" text-anchor="middle" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">5 · READY</text>
  <text x="851" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Healthy</text>
  <text x="851" y="172" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">ROLE TRUE_CACHE</text>
  <text x="851" y="192" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">READY TO USE</text>
  <text x="851" y="212" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Verify views</text>
  <text x="851" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">you verify</text>

  <line x1="926" y1="170" x2="956" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <g filter="url(#soft)">
    <rect x="958" y="100" width="58" height="140" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="987" y="160" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" transform="rotate(-90 987 170)">APP RO</text>

  <!-- Bottom notes -->
  <rect x="28" y="270" width="984" height="120" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="48" y="302" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Gates that block progress</text>
  <text x="48" y="326" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Blob ConfigMap must exist before apply · Primary must resolve TC hostname to NLB · Port 1521 open both directions · Enterprise True Cache capable image</text>
  <text x="48" y="350" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">autoTCServiceRegistration needs helper on every RAC node + externaljob.ora · Pod Ready alone is not enough — wait for DATABASE IS READY TO USE</text>
  <text x="48" y="374" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Same-cluster SIDB primary path skips DBCA blob copy: primary SIDB generates ConfigMap automatically (see True Cache Quick Start).</text>
</svg>
