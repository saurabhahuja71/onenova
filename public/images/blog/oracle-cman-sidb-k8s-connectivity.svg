<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">CMAN routing patterns for SIDB</title>
  <desc id="desc">Global next_hop versus generated remote_listener registration versus service-alias multi-backend routing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1040" height="520" rx="16" fill="url(#bg)"/>
  <text x="32" y="40" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Three SIDB routing patterns through CMAN</text>
  <text x="32" y="62" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Pick one pattern per ConnectionManager — do not mix generated rules with file configSource</text>

  <!-- Pattern A -->
  <g filter="url(#soft)">
    <rect x="40" y="100" width="300" height="200" rx="12" fill="url(#card)" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="190" y="128" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">A · GLOBAL next_hop</text>
  <text x="190" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">File mode · 1 SIDB</text>
  <text x="190" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Client → CMAN → sidb-sample</text>
  <text x="190" y="200" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">No remote_listener</text>
  <text x="190" y="224" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Best for DG / Broker</text>
  <text x="190" y="248" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">cman-sidb-nexthop.yaml</text>
  <text x="190" y="272" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Quick Start path</text>

  <!-- Pattern B -->
  <g filter="url(#soft)">
    <rect x="370" y="100" width="300" height="200" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="520" y="128" text-anchor="middle" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">B · GENERATED RULES</text>
  <text x="520" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">spec.rules[] · 1+ SIDB</text>
  <text x="520" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CMAN Healthy first</text>
  <text x="520" y="200" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">DB sets remote_listener</text>
  <text x="520" y="224" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">ALTER SYSTEM REGISTER</text>
  <text x="520" y="248" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">cman-sidb.yaml / peer.yaml</text>
  <text x="520" y="272" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Avoid for DG switchover</text>

  <!-- Pattern C -->
  <g filter="url(#soft)">
    <rect x="700" y="100" width="300" height="200" rx="12" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="850" y="128" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">C · SERVICE ALIAS</text>
  <text x="850" y="152" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">File mode · 2+ SIDBs</text>
  <text x="850" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">apppdb1 → sidb-sample</text>
  <text x="850" y="200" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">apppdb2 → sidb-cman-peer</text>
  <text x="850" y="224" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">use_service_as_tnsnames_alias</text>
  <text x="850" y="248" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">cman-sidb-peer-nexthop.yaml</text>
  <text x="850" y="272" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Good with replicas: 2</text>

  <rect x="40" y="330" width="960" height="160" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="60" y="362" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Client connect (after the pattern’s gates pass)</text>
  <text x="60" y="390" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">sqlplus 'sys/&lt;pwd&gt;@//&lt;cman-external-ip&gt;:1521/apppdb1 as sysdba'</text>
  <text x="60" y="416" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">In-cluster: @//cman-sidb.&lt;ns&gt;.svc.cluster.local:1521/apppdb1</text>
  <text x="60" y="442" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Verify: kubectl exec deploy/cman-sidb -- cmctl show services · Confirm apppdb1 (and peers) before blaming the client string</text>
  <text x="60" y="466" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">RAC: same CR — next_hop or remote_listener against SCAN Service (cman-rac*.yaml). Cross-cluster DG: docs/sidb/dataguard/DATAGUARD_CROSS_CLUSTER_CMAN.md</text>
</svg>
