<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Data Guard connectivity and day-2 operations</title>
  <desc id="desc">Same-cluster ClusterIP redo path versus cross-cluster NLB path; Broker runner for DGMGRL and kubectl operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1040" height="520" rx="16" fill="url(#bg)"/>
  <text x="32" y="40" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Connectivity + operations surfaces</text>
  <text x="32" y="62" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">ClusterIP same-cluster · NLB cross-cluster · Broker runner for DGMGRL · kubectl patch for ops</text>

  <g filter="url(#soft)">
    <rect x="40" y="100" width="280" height="150" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="180" y="132" text-anchor="middle" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">PRIMARY</text>
  <text x="180" y="158" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">ORCL1 · READ WRITE</text>
  <text x="180" y="182" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">svc: sidb-sample…svc :1521</text>
  <text x="180" y="206" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">App RW target</text>
  <text x="180" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">or NLB hostname cross-cluster</text>

  <g filter="url(#soft)">
    <rect x="380" y="100" width="280" height="150" rx="12" fill="url(#card)" stroke="#fb7185" stroke-width="1.5"/>
  </g>
  <text x="520" y="132" text-anchor="middle" fill="#fda4af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">PHYSICAL STANDBY</text>
  <text x="520" y="158" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">ORCLS · MOUNTED / APPLY</text>
  <text x="520" y="182" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">svc: standbydatabase-sample…</text>
  <text x="520" y="206" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Receives redo · FAL</text>
  <text x="520" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Active DG RO needs license/open mode</text>

  <g filter="url(#soft)">
    <rect x="720" y="100" width="280" height="150" rx="12" fill="url(#card)" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="860" y="132" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">BROKER RUNNER</text>
  <text x="860" y="158" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">…-dg-runner-*</text>
  <text x="860" y="182" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">dgmgrl /@ORCL1</text>
  <text x="860" y="206" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">SHOW CONFIGURATION</text>
  <text x="860" y="230" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">after SW: use new primary alias</text>

  <line x1="320" y1="160" x2="378" y2="160" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="349" y="148" text-anchor="middle" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">redo</text>

  <line x1="660" y1="175" x2="718" y2="175" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="689" y="163" text-anchor="middle" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">manage</text>

  <!-- Ops box -->
  <g filter="url(#soft)">
    <rect x="40" y="280" width="620" height="110" rx="12" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="350" y="312" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">DAY-2 VIA kubectl patch DataguardBroker</text>
  <text x="350" y="338" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">switchover · protectionMode · convertToSnapshot / convertToPhysical · FSFO</text>
  <text x="350" y="362" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Targets are DB_UNIQUE_NAME (ORCL1 / ORCLS) · new requestId each op · do not mix with concurrent DGMGRL</text>

  <g filter="url(#soft)">
    <rect x="680" y="280" width="320" height="110" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="840" y="312" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">OR DGMGRL ON RUNNER</text>
  <text x="840" y="338" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">SWITCHOVER TO 'ORCLS'</text>
  <text x="840" y="362" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Pick one method per operation</text>

  <rect x="40" y="420" width="960" height="76" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="60" y="448" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Cross-cluster: prefer ExternalDNS hostnames on internal NLBs for both members</text>
  <text x="60" y="472" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Standby uses primarySource.connectString to the primary NLB. Broker members list both NLB hosts. Copy current primary TDE wallet into the standby cluster before standby create.</text>
</svg>
