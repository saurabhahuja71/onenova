# CI for pull requests — GitHub-hosted runner (no self-hosted needed).
name: CI

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install & build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_GITHUB_USERNAME: saurabhahuja71
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run build:fast
