# CI for pull requests — GitHub-hosted runner (no self-hosted needed).
name: CI

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm version
        run: pnpm --version

      - name: Install & build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_GITHUB_USERNAME: saurabhahuja71
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run build:fast
