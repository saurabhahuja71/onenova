# Deploy onenova.in via GitHub Actions (GitHub-hosted runner + SSH).
#
# No self-hosted runner is required. On every push to main this workflow:
#   1. Builds the Astro static site on ubuntu-latest
#   2. rsyncs dist/ → sauahuja@136.67.97.86:/var/www/onenova (via SSH deploy key)
#   3. Runs `sudo nginx -t && sudo systemctl reload nginx` on the VM
#
# Repo secrets required:
#   ONENOVA_SSH_HOST     VM address (default 136.67.97.86)
#   ONENOVA_SSH_USER     SSH user (default sauahuja)
#   ONENOVA_SSH_KEY      private ed25519 key authorized on the VM
# Optional:
#   PERSONAL_GITHUB_TOKEN    higher GitHub API limits for stats/projects
#   PUBLIC_FORMSPREE_ID      contact form backend id
#
# git push origin main  →  site updates automatically.

name: Deploy OneNova

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-onenova
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_SITE_URL: https://onenova.in
  PUBLIC_GITHUB_USERNAME: saurabhahuja71

jobs:
  deploy:
    name: Build & deploy to onenova.in
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Astro site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          PUBLIC_GITHUB_USERNAME: ${{ env.PUBLIC_GITHUB_USERNAME }}
          PUBLIC_FORMSPREE_ID: ${{ secrets.PUBLIC_FORMSPREE_ID }}
          PUBLIC_SITE_URL: ${{ env.PUBLIC_SITE_URL }}
        run: pnpm run build:fast

      - name: Install SSH key for deploy
        env:
          ONENOVA_SSH_KEY: ${{ secrets.ONENOVA_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/onenova_deploy_key
          printf '%s\n' "$ONENOVA_SSH_KEY" > /tmp/onenova_deploy_key

      - name: Deploy to VM (rsync + nginx reload)
        env:
          ONENOVA_SSH_HOST: ${{ secrets.ONENOVA_SSH_HOST }}
          ONENOVA_SSH_USER: ${{ secrets.ONENOVA_SSH_USER }}
          ONENOVA_SSH_KEY_FILE: /tmp/onenova_deploy_key
          DIST_DIR: dist
        run: bash deploy/scripts/deploy-remote-github.sh

      - name: Verify site on origin
        env:
          ONENOVA_SSH_HOST: ${{ secrets.ONENOVA_SSH_HOST }}
        run: |
          sleep 2
          code="$(curl -skS -o /dev/null -w '%{http_code}' --max-time 15 --resolve onenova.in:443:"${ONENOVA_SSH_HOST}" https://onenova.in/ || true)"
          echo "origin https://onenova.in status: ${code}"
          test "${code}" = "200"

      - name: Verify site through Cloudflare (informational)
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://onenova.in/ || true)"
          echo "public https://onenova.in status: ${code} (Cloudflare may 403 datacenter IPs; not a failure)"
          test "${code}" = "200" -o "${code}" = "403" -o "${code}" = "301" -o "${code}" = "302"
