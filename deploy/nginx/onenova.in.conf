# Nginx site config for onenova.in + www.onenova.in
# Install:
#   sudo cp deploy/nginx/onenova.in.conf /etc/nginx/sites-available/onenova.in
#   # On RHEL/Oracle Linux without sites-available:
#   sudo cp deploy/nginx/onenova.in.conf /etc/nginx/conf.d/onenova.in.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS certs are managed by Certbot (see deploy/scripts/setup-vm.sh).
# Email MX/TXT records for Purelymail are NOT modified by this config.

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (both apex and www)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name onenova.in www.onenova.in;

    # ACME challenge for Let's Encrypt renewals
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — apex
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onenova.in;

    # --- TLS (Certbot will adjust these paths if needed) ---
    ssl_certificate     /etc/letsencrypt/live/onenova.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onenova.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/onenova.in/chain.pem;

    # Modern TLS baseline
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP kept intentionally permissive for Google Fonts + GitHub avatars/charts
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.counterapi.dev https://api.github.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://formspree.io mailto:" always;

    # --- Document root (Astro static build) ---
    root /var/www/onenova;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2
        application/manifest+json;

    # Access / error logs
    access_log /var/log/nginx/onenova.access.log;
    error_log  /var/log/nginx/onenova.error.log warn;

    # Astro hashed assets — long cache
    location ^~ /_assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static images / icons
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Resume PDF
    location ^~ /resume/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML + trailing-slash-less routes (Astro trailingSlash: 'never')
    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
    }

    # Explicit 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — www (serve same site; optional canonical redirect to apex)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.onenova.in;

    ssl_certificate     /etc/letsencrypt/live/onenova.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onenova.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/onenova.in/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Canonical: www → apex (keeps path/query)
    return 301 https://onenova.in$request_uri;
}
